name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust WASI target
        run: rustup target add wasm32-wasip2
      - name: Check extension
        run: cargo check --target wasm32-wasip2
      - name: Check proxy syntax
        run: node --check assets/ets-language-server.mjs
      - name: Test proxy diagnostics
        run: node scripts/test-lsp-proxy.mjs
      - name: Verify bundled diagnostic language server
        run: |
          grep -q 'project-root-files' assets/diagnostic-language-server.mjs
          grep -q 'program-get-end' assets/diagnostic-language-server.mjs
      - name: Check bundled task definitions
        run: node -e "JSON.parse(require('fs').readFileSync('languages/arkts/tasks.json', 'utf8'))"
      - name: Reject personal absolute paths
        run: |
          if git grep -n -E '/Users/[^/]+|[A-Z]:\\Users\\' -- . ':(exclude).github/workflows/ci.yml'; then
            exit 1
          fi
