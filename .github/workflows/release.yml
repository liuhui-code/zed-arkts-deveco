name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.3.2
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          }
      - name: Install NSIS
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "NSIS\makensis.exe"),
            (Join-Path ([Environment]::GetFolderPath("ProgramFiles")) "NSIS\makensis.exe"),
            (Join-Path $env:ChocolateyInstall "bin\makensis.exe")
          )
          foreach ($attempt in 1..3) {
            choco install nsis --no-progress -y
            if ($candidates | Where-Object { Test-Path $_ }) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          throw "Chocolatey did not install makensis.exe after 3 attempts"
      - name: Validate Windows environment detector
        shell: pwsh
        run: |
          $powershell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $script = (Resolve-Path "./installer/windows/environment-check.ps1").Path
          $statusFile = Join-Path $env:RUNNER_TEMP "environment-status.ini"
          $stdout = Join-Path $env:RUNNER_TEMP "environment-status.json"
          $stderr = Join-Path $env:RUNNER_TEMP "environment-status.err"
          $process = Start-Process $powershell -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $script,
            "-Mode", "Check", "-StatusFile", $statusFile, "-Json"
          ) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          if ($process.ExitCode -notin @(0, 2)) {
            throw "Unexpected detector exit code $($process.ExitCode): $(Get-Content $stderr -Raw)"
          }
          if (-not (Test-Path $statusFile)) { throw "Detector did not write the NSIS status file" }
          $status = Get-Content $stdout -Raw | ConvertFrom-Json
          if ($null -eq $status.Ready -or -not $status.Summary) { throw "Detector returned an incomplete status" }
          foreach ($name in @("Zed", "Node", "Npm", "DevEcoCli", "DevEcoToolchain")) {
            if ($null -eq $status.Components.$name.Ready) { throw "Missing component status: $name" }
          }
      - name: Validate Windows task registration
        shell: pwsh
        run: |
          $powershell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $script = (Resolve-Path "./installer/windows/task-registration.ps1").Path
          $sourceTasks = (Resolve-Path "./languages/arkts/tasks.json").Path
          $stateDirectory = Join-Path $env:RUNNER_TEMP "arkts-task-state"
          $tasksFile = Join-Path $env:RUNNER_TEMP "zed-tasks.json"
          $originalTasks = "// Preserve this comment`r`n[`r`n  {`r`n    `"label`": `"Existing Task`",`r`n    `"command`": `"echo existing`"`r`n  },`r`n]`r`n"
          [IO.File]::WriteAllText($tasksFile, $originalTasks, [Text.UTF8Encoding]::new($false))
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $script -Mode Install -StateDir $stateDirectory -SourceTasks $sourceTasks -TasksFile $tasksFile
          if ($LASTEXITCODE -ne 0) { throw "Task registration failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $stateDirectory "tasks.arkts-deveco.sha256"))) { throw "Task registration did not save its state hash" }
          if ([IO.File]::ReadAllText($tasksFile) -notmatch 'ArkTS: Build Debug') { throw "Task registration did not add ArkTS tasks" }
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $script -Mode Uninstall -StateDir $stateDirectory -TasksFile $tasksFile
          if ($LASTEXITCODE -ne 0) { throw "Task unregistration failed with exit code $LASTEXITCODE" }
          if ([IO.File]::ReadAllText($tasksFile) -cne $originalTasks) { throw "Task unregistration did not restore the original file" }
      - name: Build extension and Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ steps.version.outputs.value }}"
      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $installer = Get-Item "dist/zed-arkts-deveco-${{ steps.version.outputs.value }}-x64.exe"
          $globalTasks = Join-Path $env:APPDATA "Zed\tasks.json"
          New-Item (Split-Path -Parent $globalTasks) -ItemType Directory -Force | Out-Null
          $originalTasks = @'
          // Existing user task must survive installation and uninstallation.
          [
            {
              "label": "Existing Task",
              "command": "echo existing"
            },
          ]
          '@
          [IO.File]::WriteAllText($globalTasks, $originalTasks, [Text.UTF8Encoding]::new($false))
          $install = Start-Process $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $manifest = Join-Path $env:LOCALAPPDATA "Zed\extensions\installed\arkts-deveco\extension.toml"
          $wasm = Join-Path $env:LOCALAPPDATA "Zed\extensions\installed\arkts-deveco\extension.wasm"
          $grammar = Join-Path $env:LOCALAPPDATA "Zed\extensions\installed\arkts-deveco\grammars\arkts.wasm"
          $taskInstaller = Join-Path $env:LOCALAPPDATA "ArkTSDevEco\task-registration.ps1"
          foreach ($path in @($manifest, $wasm, $grammar, $taskInstaller, $globalTasks)) {
            if (-not (Test-Path $path)) { throw "Missing installed file: $path" }
          }
          $registeredTasks = [IO.File]::ReadAllText($globalTasks)
          foreach ($label in @(
            "Existing Task",
            "ArkTS: Build Debug",
            "ArkTS: Build Release",
            "ArkTS: Build and Run",
            "ArkTS: Clean",
            "ArkTS: Check Lint",
            "ArkTS: List Devices",
            "ArkTS: Device Logs"
          )) {
            $pattern = '"label"\s*:\s*"' + [regex]::Escape($label) + '"'
            if ($registeredTasks -notmatch $pattern) {
              throw "Global task was not preserved or registered: $label"
            }
          }
          $stateDirectory = Join-Path $env:LOCALAPPDATA "ArkTSDevEco"
          $backupTasks = Join-Path $stateDirectory "tasks.before-arkts-deveco.json"
          $installedHashFile = Join-Path $stateDirectory "tasks.arkts-deveco.sha256"
          if (-not (Test-Path $backupTasks)) { throw "Installer did not back up the existing Zed tasks file" }
          $backedUpTasks = [IO.File]::ReadAllText($backupTasks)
          if ($backedUpTasks -cne $originalTasks) { throw "Installer backup differs from the original Zed tasks file" }
          $recordedHash = ([IO.File]::ReadAllText($installedHashFile)).Trim()
          $registeredHash = (Get-FileHash $globalTasks -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($recordedHash -cne $registeredHash) { throw "Registered tasks hash does not match installer state" }
          $uninstaller = Join-Path $env:LOCALAPPDATA "ArkTSDevEco\Uninstall.exe"
          $uninstall = Start-Process $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          $restoredTasks = [IO.File]::ReadAllText($globalTasks)
          if ($restoredTasks -cne $originalTasks) {
            throw "Uninstaller did not restore the original Zed tasks file (expected length $($originalTasks.Length), actual length $($restoredTasks.Length))"
          }
      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $assets = @(
            Get-Item "dist/zed-arkts-deveco-${{ steps.version.outputs.value }}-x64.exe"
            Get-Item "dist/zed-arkts-deveco-${{ steps.version.outputs.value }}.tar.gz"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: zed-arkts-deveco-${{ steps.version.outputs.value }}
          path: |
            dist/*.exe
            dist/*.tar.gz
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe dist/zed-arkts-deveco-${{ steps.version.outputs.value }}.tar.gz dist/SHA256SUMS.txt --generate-notes --title "ArkTS DevEco ${{ steps.version.outputs.value }}"
